[colors]
background = ${xrdb:background}
foreground = #adb1b9

color0 = ${xrdb:color0}
color1 = ${xrdb:color1}
color2 = ${xrdb:color2}
color3 = ${xrdb:color3}
color4 = ${xrdb:color4}
color5 = ${xrdb:color5}
color6 = ${xrdb:color6}
color7 = ${xrdb:color7}
color8 = ${xrdb:color8}
color9 = ${xrdb:color9}
color10 = ${xrdb:color10}
color11 = ${xrdb:color11}
color12 = ${xrdb:color12}
color13 = ${xrdb:color13}
color14 = ${xrdb:color14}
color15 = ${xrdb:color15}
dark-light = #272A2B
active-light = #313435

[bar/example]
monitor = ${env:MONITOR}
bottom = false
tray-position = right
tray-padding = 5
;monitor = eDP-1
width                    = 98%
height                   = 46 
padding-left = 0
padding-right = 0
dpi                      = 192
background = #1e222a 
foreground = #c8ccd4
border-top-size = 7
border-bottom-size = 7
border-top-color = #1e222a
border-bottom-color = #1e222a
offset-x = 0%
offset-y = 0%
fixed-center = true
line-size = 3
wm-restack = i3

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=13;3
font-1 = JetBrainsMono Nerd Font:size=18;5
font-2 = Material Design Icons:style=Bold:size=13;3
font-3 = unifont:fontformat=truetype:size=13:antialias=true;

enable-ipc=true
modules-left = powermenu i3 
modules-center =
modules-right =   temperature alsa battery mem round-left time round-right
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/mem]
type = custom/script
exec = free -m | sed -n 's/^Mem:\s\+[0-9]\+\s\+\([0-9]\+\)\s.\+/\1/p'
format = <label>
format-prefix = " ﬙"
label = %output% MB
label-padding = 1
format-prefix-foreground = #d19a66

[module/alsa]
type = internal/alsa
format-volume = <label-volume> <bar-volume>
label-volume = ""
label-volume-foreground = #c8ccd4 

format-muted-foreground = #c8ccd4
label-muted = 󰚙

format-muted-padding = 1
format-muted-background = #2b2f37

bar-volume-width = 10
bar-volume-foreground-0 = #61afef
bar-volume-foreground-1 = #61afef
bar-volume-foreground-2 = #61afef
bar-volume-foreground-3 = #61afef
bar-volume-foreground-4 = #61afef
bar-volume-foreground-5 = #61afef
bar-volume-foreground-6 = #61afef
bar-volume-gradient = false
bar-volume-indicator = |
bar-volume-indicator-foreground = #61afef
bar-volume-indicator-font = 2
bar-volume-fill = -
bar-volume-fill-foreground = #61afef
bar-volume-fill-font = 2
bar-volume-empty = -
bar-volume-empty-font = 2
bar-volume-empty-foreground = #c8ccd4
format-volume-padding = 1

[module/round-left]
type = custom/text
content = %{T3}%{T-}
content-foreground = #2b2f37

[module/round-right]
type = custom/text
content = %{T3}%{T-}
content-foreground = #2b2f37

[module/time]
type = internal/date
interval = 60
format = <label>
format-background = #2b2f37
date = %{F#888e96}󰥔 %I:%M %p%{F-}
time-alt = %{F#61afef}󰃭 %a, %b %d%{F-}

label = %date%%time%

[module/powermenu]
type = custom/text
content =" "
content-padding =1
click-left = xfce4-settings-manager &
content-foreground =  #61afef

[module/date]
type = internal/date
interval = 60
date = %a %d %b
time = %l:%M %p
label =   %date%   %time%
;label =  %time%
format-padding = 1

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 98

format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%

format-charging-padding = 1
format-charging-foreground = #adb1b9

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

format-discharging-foreground = #adb1b9
format-full-prefix = "  "

format-full-prefix-foreground = #A0E8A2
format-foreground = #adb1b9
format-background = #2b2f37

label-discharging-foreground = #adb1b9
ramp-capacity-foreground =  #A0E8A2
label-charging-foreground = #adb1b9

ramp-capacity-0 = "  "
ramp-capacity-1 = "  "
ramp-capacity-2 = "  "
ramp-capacity-3 = "  "
ramp-capacity-4 = "  "
animation-charging-0 = "  "
animation-charging-1 = "  "
animation-charging-2 = "  "
animation-charging-3 = "  "
animation-charging-4 = "  "

animation-charging-foreground = #DF8890
animation-charging-framerate = 910
format-discharging-padding = 1

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 70

format = <ramp> <label>
format-warn = <ramp> <label-warn>
format-padding = 0
label = %temperature%
label-warn = %temperature%
ramp-0 =  "󰜗"
ramp-foreground = #a4ebf3
label-padding-right = 1

[module/wlan]
type = internal/network
interface = wlp0s20f3 
;interface = enp30s0
interval = 5
label-connected =   %essid% 
;label-disconnected = -

[module/eth]
type = internal/network
interface = enp2s0
interval = 3.0
format-connected = <label-connected>
format-connected-prefix = "  "
format-connected-prefix-foreground = #eceff4
label-connected = %downspeed:9%
format-disconnected = <label-disconnected>
label-disconnected = not connected
label-disconnected-foreground = #66ffffff
format-padding = 1

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true

enable-click = false
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
format = <label-state>   <label-mode>
label-focused = %name%
label-focused-padding = 1
label-focused-underline =  #565c64
label-focused-background = #2b2f37
;label-focused-foreground = "#2b2f37"

label-unfocused-background = #2b2f37
label-unfocused = %name%
label-unfocused-padding = 1
;label-visible = %name%
;label-mode = %mode%

label-mode-background = #2b2f37
label-mode-foreground = "#32302f"
label-mode-padding = 1
label-urgent = %name%
label-urgent-padding = 1
